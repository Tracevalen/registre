# Publie le site sur GitHub Pages à chaque push sur main.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reprend la dernière liste de personnages téléchargée avec succès.
      - id: cards-cache
        uses: actions/cache/restore@v4
        with:
          path: src/data/cards.json
          key: cards-${{ github.run_id }}
          restore-keys: cards-
      # Met à jour les 1000 personnages depuis AniList, 4 minutes maximum.
      # Si AniList est lent ou refuse, on garde la liste précédente et le site se publie quand même.
      - id: cards
        run: npm run cards
        timeout-minutes: 4
        continue-on-error: true
      - if: steps.cards.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/cards.json
          key: cards-${{ github.run_id }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
